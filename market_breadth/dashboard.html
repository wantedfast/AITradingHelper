<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>量能宽广度监控</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --mute:#6b7280; --line:#e5e7eb; --up:#d43f3a; --down:#1a9f5c; --warn:#b45309; --warnbg:#fef3c7; --c1:#2563eb; --c2:#d43f3a; --c3:#7c3aed; --c4:#0f766e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --card:#1a1e24; --ink:#e7eaee; --mute:#9aa3af; --line:#2b313a; --warn:#fbbf24; --warnbg:#3a2e10; --c1:#60a5fa; --c2:#f87171; --c3:#c084fc; --c4:#2dd4bf; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  main { max-width:980px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:20px; margin:0 0 2px; }
  .sub { color:var(--mute); font-size:13px; margin-bottom:14px; }
  .banner { padding:12px 14px; border-radius:10px; margin-bottom:14px; background:var(--card); border:1px solid var(--line); font-weight:600; }
  .banner.warn { background:var(--warnbg); color:var(--warn); border-color:transparent; }
  .banner.err { color:var(--up); }
  .banner.good { border-left:5px solid var(--up); } .banner.bad { border-left:5px solid var(--down); } .banner.warn { border-left:5px solid var(--warn); }
  .banner .t { font-size:22px; font-weight:700; margin-bottom:8px; }
  .banner dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:0 0 10px; font-weight:400; color:var(--ink); }
  .banner dt { color:var(--mute); white-space:nowrap; } .banner dd { margin:0; }
  .banner ul { margin:0; padding-left:18px; font-weight:400; font-size:13.5px; color:var(--ink); }
  .banner .h { margin-top:10px; padding-top:8px; border-top:1px solid var(--line); font-weight:400; font-size:12.5px; color:var(--mute); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .k { color:var(--mute); font-size:13px; }
  .v { font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; margin:2px 0; }
  .n { color:var(--mute); font-size:12px; }
  .idx { display:flex; flex-wrap:wrap; gap:8px 18px; font-size:13px; font-variant-numeric:tabular-nums; }
  .up { color:var(--up); } .down { color:var(--down); }
  h2 { font-size:15px; margin:0 0 8px; }
  svg { width:100%; height:auto; display:block; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12px; color:var(--mute); margin-top:6px; }
  .legend i { display:inline-block; width:10px; height:3px; margin-right:5px; vertical-align:middle; }
  .foot { color:var(--mute); font-size:12px; margin-top:14px; }
</style>
</head>
<body>
<main>
  <h1>量能宽广度监控</h1>
  <div class="sub" id="sub">加载中…</div>
  <div class="banner" id="banner">加载中…</div>
  <div class="grid" id="cards"></div>
  <div class="card" style="margin-bottom:12px"><div class="idx" id="idx"></div></div>
  <div class="card" style="margin-bottom:12px">
    <h2>今日盘中走势</h2>
    <div id="chart"></div>
    <div class="legend">
      <span><i style="background:var(--c1)"></i>涨家占比 %</span>
      <span><i style="background:var(--c2)"></i>涨额占比 %</span>
      <span><i style="background:var(--c3)"></i>额价差</span>
    </div>
  </div>
  <div class="card">
    <h2>Arms 盘中走势</h2>
    <div id="chart2"></div>
  </div>
  <div class="foot">
    数据来自腾讯公开行情，覆盖沪深京全部 A 股，剔除停牌。额价差 = 涨额占比 − 涨家占比；Arms = (涨家÷跌家) ÷ (上涨成交额÷下跌成交额)。大盘股指总市值前 300 只。推断逻辑来自视频，判断线是自定的，可在 breadth.mjs 顶部调整。结论是按规则自动生成的推断，不是投资建议。
  </div>
</main>
<script>
const f = (x, n = 1) => x == null ? '–' : Number(x).toFixed(n);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function line(pts, key, color, W, H, pad, min, max) {
  const ok = pts.map((p, i) => [i, p[key]]).filter(p => p[1] != null);
  if (ok.length < 2) return '';
  const x = i => pad + i * (W - pad * 2) / Math.max(pts.length - 1, 1), y = v => H - 18 - (v - min) * (H - 30) / (max - min || 1);
  return `<polyline fill="none" stroke="${color}" stroke-width="2" points="${ok.map(p => x(p[0]).toFixed(1) + ',' + y(p[1]).toFixed(1)).join(' ')}"/>`;
}
function chart(el, pts, series, min, max, refs = []) {
  const W = 900, H = 240, pad = 34;
  if (pts.length < 2) { el.innerHTML = '<div class="n">盘中数据不足，开盘后每分钟记录一个点。</div>'; return; }
  const y = v => H - 18 - (v - min) * (H - 30) / (max - min || 1);
  let g = '';
  for (const r of refs) g += `<line x1="${pad}" x2="${W - pad}" y1="${y(r)}" y2="${y(r)}" stroke="var(--line)" stroke-dasharray="4 4"/><text x="2" y="${y(r) + 4}" font-size="11" fill="var(--mute)">${r}</text>`;
  const step = Math.max(1, Math.floor(pts.length / 6));
  pts.forEach((p, i) => { if (i % step === 0) g += `<text x="${pad + i * (W - pad * 2) / (pts.length - 1)}" y="${H - 3}" font-size="11" fill="var(--mute)" text-anchor="middle">${esc(p.t)}</text>`; });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${series.map(s => line(pts, s[0], s[1], W, H, pad, min, max)).join('')}</svg>`;
}
async function load() {
  let s;
  try { s = await (await fetch('/api/state', { cache: 'no-store' })).json(); }
  catch { document.getElementById('banner').className = 'banner err'; document.getElementById('banner').textContent = '连不上本地脚本，请确认 node breadth.mjs 正在运行。'; return; }
  const b = document.getElementById('banner');
  if (!s.snap) { b.className = 'banner err'; b.textContent = s.error ? '取数失败：' + s.error : '正在取数…'; return; }
  document.getElementById('sub').textContent = `更新于 ${s.updated}（北京时间） · ${s.trading ? '盘中，每分钟刷新' : '非交易时段，显示最近一次读数'}` + (s.error ? ` · 最近一次刷新失败：${s.error}` : '');
  const v = s.verdict, n = s.snap, m = s.mcl || {};
  let hist = '';
  if (v.hist && v.hist.d5 && s.histBase) {
    const h = v.hist, base = s.histBase;
    hist = `<div class="h">历史上这种情况准不准（两年收盘数据，出现过 ${h.n} 次）：之后 5 日上证平均 ${f(h.d5.mean, 2)}%，其中 ${f(h.d5.downRate, 0)}% 的次数下跌；之后 20 日平均 ${f(h.d20.mean, 2)}%，${f(h.d20.downRate, 0)}% 的次数下跌。对比所有交易日：5 日平均 ${f(base.d5.mean, 2)}%、${f(base.d5.downRate, 0)}% 下跌；20 日平均 ${f(base.d20.mean, 2)}%、${f(base.d20.downRate, 0)}% 下跌。</div>`;
  } else if (v.key !== 'none') hist = '<div class="h">这种情况没有历史回测数据。</div>';
  b.className = 'banner ' + (v.level || '');
  b.innerHTML = `<div class="t">${esc(v.title)}</div>` + (v.money ? `<dl><dt>大资金在干什么</dt><dd>${esc(v.money)}</dd><dt>可不可持续</dt><dd>${esc(v.sustain)}</dd><dt>接下来</dt><dd>${esc(v.next)}</dd></dl>` : '')
    + `<ul>${(v.evidence || []).map(e => `<li>${esc(e)}</li>`).join('')}</ul>` + hist;
  const cards = [
    ['涨家占比', f(n.upCountPct) + '%', `涨 ${n.up} · 跌 ${n.down} · 平 ${n.flat}`],
    ['涨额占比', f(n.upAmtPct) + '%', `两市成交 ${f(n.amt / 1e8, 0)} 亿`],
    ['额价差', f(n.spread), `预警线：大于 ${s.cfg.spreadAbove}`],
    ['Arms', f(n.arms, 2), `预警线：小于 ${s.cfg.armsBelow}`],
    ['大盘股 / 中小盘上涨比例', f(n.big.upCountPct, 0) + '% / ' + f(n.small.upCountPct, 0) + '%', `大盘股占成交额 ${f(n.big.amtShare)}%`],
    ['麦克连摆', m.days >= 39 ? f(m.value, 0) : '积累中', m.days >= 39 ? (m.rising ? '在上行' : '在下行') + ` · ${m.days} 个交易日` : `已记录 ${m.days || 0}/39 个交易日`],
  ];
  document.getElementById('cards').innerHTML = cards.map(c => `<div class="card"><div class="k">${c[0]}</div><div class="v">${esc(c[1])}</div><div class="n">${esc(c[2])}</div></div>`).join('');
  document.getElementById('idx').innerHTML = s.indexes.map(i => `<span>${esc(i.name)} ${f(i.price, 2)} <b class="${i.pct > 0 ? 'up' : i.pct < 0 ? 'down' : ''}">${i.pct > 0 ? '+' : ''}${f(i.pct, 2)}%</b></span>`).join('');
  chart(document.getElementById('chart'), s.intraday, [['c', 'var(--c1)'], ['a', 'var(--c2)'], ['sp', 'var(--c3)']], -40, 100, [0, 50, 100]);
  const ar = s.intraday.map(p => p.ar).filter(v => v != null);
  chart(document.getElementById('chart2'), s.intraday, [['ar', 'var(--c4)']], 0, Math.max(2, ...ar), [1]);
}
load(); setInterval(load, 30000);
</script>
</body>
</html>
