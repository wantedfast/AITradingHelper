<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 盯盘</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --text: #f4f0e8;
      --muted: #9f9a90;
      --gold: #C9A646;
      --gold-light: #F5D77A;
      --line: rgba(255,255,255,.12);
      --green: #72df8e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 78% 8%, rgba(201,166,70,.13), transparent 32%),
        radial-gradient(circle at 48% 52%, rgba(245,215,122,.045), transparent 34%),
        #050505;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .3;
      background-image:
        linear-gradient(rgba(245,215,122,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245,215,122,.024) 1px, transparent 1px);
      background-size: 58px 58px;
      mask-image: radial-gradient(circle at 63% 22%, black, transparent 70%);
    }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }
    .app { position: relative; z-index: 1; display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
    .sidebar {
      min-height: 100vh;
      padding: 28px 20px;
      border-right: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.012));
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 26px;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 900; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; color: var(--gold-light); }
    .pro { padding: 3px 6px; border-radius: 6px; color: #1b1303; background: linear-gradient(135deg, #FFF1B8, var(--gold)); font-size: 11px; font-weight: 900; }
    .menu { display: grid; gap: 8px; }
    .menu a {
      min-height: 54px;
      padding: 0 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(244,240,232,.68);
      font-weight: 700;
      border: 1px solid transparent;
    }
    .menu a.active {
      color: var(--gold-light);
      border-color: rgba(245,215,122,.42);
      background:
        radial-gradient(circle at 22% 30%, rgba(245,215,122,.2), transparent 38%),
        linear-gradient(135deg, rgba(201,166,70,.22), rgba(255,255,255,.035));
      box-shadow: inset 0 0 16px rgba(201,166,70,.12), 0 0 20px rgba(201,166,70,.12);
    }
    .side-hint {
      align-self: end;
      padding: 14px;
      border: 1px solid rgba(245,215,122,.16);
      border-radius: 14px;
      color: rgba(244,240,232,.54);
      background: rgba(255,255,255,.025);
      font-size: 12px;
      line-height: 1.7;
    }
    .main { padding: 34px 44px; }
    .topbar { display: flex; justify-content: flex-end; gap: 16px; }
    .upgrade { min-height: 38px; padding: 0 18px; border: 0; border-radius: 9px; color: #1d1302; background: linear-gradient(135deg, #FFF1B8, #F5D77A 50%, #C9A646); font-weight: 900; cursor: pointer; }
    .hero { margin-top: 42px; }
    h1 {
      margin: 0;
      font-size: 44px;
      background: linear-gradient(135deg, #FFF1B8, #F5D77A 48%, #C9A646 72%, #8A6A2A);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p { margin: 12px 0 0; color: rgba(244,240,232,.72); }
    .content { margin-top: 40px; display: grid; grid-template-columns: minmax(520px, 1fr) 420px; gap: 28px; align-items: start; }
    .panel {
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      background:
        radial-gradient(circle at 30% 20%, rgba(245,215,122,.08), transparent 28%),
        linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.018));
      box-shadow: 0 28px 90px rgba(0,0,0,.28);
    }
    .watch-board { min-height: 560px; padding: 28px; }
    .radar { min-height: 280px; display: grid; place-items: center; position: relative; }
    .ring { position: absolute; border: 1px solid rgba(245,215,122,.22); border-radius: 50%; animation: spin 18s linear infinite; }
    .r1 { width: 260px; height: 260px; }.r2 { width: 180px; height: 180px; animation-direction: reverse; }.r3 { width: 92px; height: 92px; }
    .core { width: 56px; height: 56px; border-radius: 50%; background: radial-gradient(circle at 36% 28%, #FFF1B8, #C9A646 48%, #3A2A0A 100%); box-shadow: 0 0 42px rgba(201,166,70,.42); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .alerts { display: grid; gap: 12px; margin-top: 22px; }
    .alert {
      min-height: 76px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 12px;
      color: inherit;
      background: rgba(0,0,0,.2);
      text-align: left;
      cursor: pointer;
    }
    .alert b { font-size: 18px; }
    .alert span { color: rgba(244,240,232,.58); }
    .alert em { grid-row: 1 / span 2; align-self: center; font-style: normal; color: var(--gold-light); font-weight: 900; }
    .plan { padding: 26px; }
    .plan h2 { margin: 0 0 18px; }
    .field { display: grid; gap: 8px; margin-top: 14px; }
    .field label { color: rgba(244,240,232,.58); font-size: 13px; font-weight: 800; }
    .field input, .field select {
      min-height: 44px;
      border: 1px solid rgba(245,215,122,.18);
      border-radius: 10px;
      padding: 0 12px;
      color: var(--text);
      background: rgba(0,0,0,.24);
    }
    .trigger { margin-top: 18px; width: 100%; min-height: 48px; border: 0; border-radius: 10px; color: #1d1302; background: linear-gradient(135deg, #FFF1B8, #F5D77A 50%, #C9A646); font-weight: 900; cursor: pointer; }
    .status { margin-top: 16px; padding: 14px; border: 1px solid rgba(255,255,255,.1); border-radius: 12px; color: rgba(244,240,232,.68); background: rgba(0,0,0,.18); line-height: 1.7; }
    .toast { position: fixed; right: 28px; bottom: 28px; max-width: 360px; padding: 15px 16px; border: 1px solid rgba(245,215,122,.28); border-radius: 14px; color: rgba(244,240,232,.88); background: rgba(8,8,8,.94); opacity: 0; transform: translateY(12px); transition: .2s ease; pointer-events: none; z-index: 8; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 1120px) { .app { grid-template-columns: 1fr; } .sidebar { display:none; } .content { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <a class="brand" href="index.html"><span class="brand-mark"><i data-lucide="triangle"></i></span><span>AI Trading</span><span class="pro">Pro</span></a>
      <nav class="menu" aria-label="核心功能">
        <a href="review.html"><i data-lucide="briefcase-business"></i><span>AI 复盘</span></a>
        <a class="active" href="watch.html"><i data-lucide="radar"></i><span>AI 盯盘</span></a>
      </nav>
      <div class="side-hint">从这里切换核心功能：先复盘交易，再把结论变成盯盘预案。</div>
    </aside>
    <section class="main">
      <header class="topbar"><button class="upgrade" data-action="upgrade">升级会员</button></header>
      <section class="hero">
        <h1>AI 盯盘</h1>
        <p>把复盘结论变成盘中预案，价格、量能、指数和板块环境触发后提醒执行</p>
      </section>
      <section class="content">
        <section class="panel watch-board">
          <div class="radar">
            <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><span class="core"></span>
          </div>
          <div class="alerts">
            <button class="alert" id="mainAlert"><b>长电科技</b><span>反抽至 82.05 · 减仓/走人</span><em id="alertState">待触发</em></button>
            <button class="alert"><b>指数环境</b><span>沪深300 放量转弱 · 降低仓位</span><em>联动</em></button>
            <button class="alert"><b>语音提醒</b><span>别恋战，剧本写好了，现在执行。</span><em>已配置</em></button>
          </div>
        </section>
        <aside class="panel plan">
          <h2>盯盘预案</h2>
          <div class="field"><label>标的</label><input id="stockName" value="长电科技" /></div>
          <div class="field"><label>触发价</label><input id="triggerPrice" value="82.05" /></div>
          <div class="field"><label>动作</label><select id="action"><option>减仓/走人</option><option>止损</option><option>继续观察</option></select></div>
          <div class="field"><label>提醒文案</label><input id="voiceLine" value="别恋战，剧本写好了，现在执行。" /></div>
          <button class="trigger" id="simulateTrigger">模拟触发</button>
          <div class="status" id="status">状态：等待触发。</div>
        </aside>
      </section>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script>
    lucide.createIcons({ attrs: { width: 20, height: 20, strokeWidth: 1.8 } });
    const toast = document.getElementById("toast");
    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
    }
    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "zh-CN";
      utterance.pitch = 1.16;
      speechSynthesis.speak(utterance);
    }
    document.getElementById("simulateTrigger").addEventListener("click", () => {
      const stock = document.getElementById("stockName").value || "长电科技";
      const price = document.getElementById("triggerPrice").value || "82.05";
      const action = document.getElementById("action").value;
      const line = document.getElementById("voiceLine").value;
      document.getElementById("alertState").textContent = "已触发";
      document.getElementById("status").textContent = `${stock} 已触发 ${price}，执行动作：${action}。`;
      showToast(`${stock} 到达 ${price}，提醒执行：${action}`);
      speak(line);
    });
    document.querySelectorAll("[data-action]").forEach((node) => node.addEventListener("click", () => showToast("会员能力后续接入。")));
  </script>
</body>
</html>
