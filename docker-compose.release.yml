version: "3.3"

# Production release manifest. Images are built on the operator workstation and
# loaded on the server before this file is used. Never add `build:` here.
services:
  trade-review-api:
    image: aitrading/trade-review-api:${RELEASE_TAG}
    container_name: trade-review-api
    labels:
      com.aitrading.managed: "true"
    restart: unless-stopped
    command: ["python", "-m", "trade_review_agent.api.simple_api"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8600/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "127.0.0.1:8600:8600"
    volumes:
      - ${DEPLOY_ROOT:-/opt/trade-review-agent}/work:/app/work
      - ${DEPLOY_ROOT:-/opt/trade-review-agent}/outputs:/app/outputs
    env_file:
      - ${DEPLOY_ROOT:-/opt/trade-review-agent}/.env
    environment:
      - TZ=Asia/Shanghai

  trade-review-frontend:
    image: aitrading/trade-review-frontend:${RELEASE_TAG}
    container_name: trade-review-frontend
    labels:
      com.aitrading.managed: "true"
    restart: unless-stopped
    depends_on:
      - trade-review-api
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - TZ=Asia/Shanghai
      - INTERNAL_API_BASE=http://trade-review-api:8600
      - NEXT_PUBLIC_API_BASE=
