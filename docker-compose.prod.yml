version: "3.3"

services:
  market-breadth:
    build:
      context: ./market_breadth
    image: ${BREADTH_IMAGE:-aitrading/market-breadth:local}
    container_name: market-breadth
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3211/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./work/market_breadth:/app/runtime/data
    environment:
      - TZ=Asia/Shanghai

  trade-review-api:
    build: .
    image: ${API_IMAGE:-aitrading/trade-review-api:local}
    container_name: trade-review-api
    restart: unless-stopped
    command: ["python", "-m", "trade_review_agent.api.simple_api"]
    depends_on:
      - market-breadth
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8600/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "127.0.0.1:8600:8600"
    volumes:
      - ./work:/app/work
      - ./outputs:/app/outputs
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - MARKET_BREADTH_INTERNAL_URL=http://market-breadth:3211

  trade-review-frontend:
    build:
      context: ./frontend
      args:
        INTERNAL_API_BASE: http://trade-review-api:8600
    image: ${FRONTEND_IMAGE:-aitrading/trade-review-frontend:local}
    container_name: trade-review-frontend
    restart: unless-stopped
    depends_on:
      - trade-review-api
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - TZ=Asia/Shanghai
      - INTERNAL_API_BASE=http://trade-review-api:8600
      - NEXT_PUBLIC_API_BASE=
